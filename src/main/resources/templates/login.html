<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Name Garden · Sign in</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><main class="auth"><div class="eyebrow">Name Garden · Sarvam AI</div><h1>Welcome back.</h1><p class="intro">Language-based name suggestions powered by Sarvam AI.</p><div class="error" th:if="${param.error}">Incorrect username or password.</div><div class="notice" th:if="${param.registered}">Account created. Sign in to begin.</div><div class="notice" th:if="${param.logout}">You have signed out.</div><form class="card" method="post" th:action="@{/login}"><label>Username<input name="username" required autocomplete="username" maxlength="50"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in →</button></form><p>First time here? <a th:href="@{/register}">Create a local account</a>.</p><footer th:replace="~{fragments :: footer}"></footer></main></body></html>
