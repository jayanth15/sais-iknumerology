<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Name Garden · Create account</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><main class="auth"><div class="eyebrow">Name Garden · Sarvam AI</div><h1>Make it yours.</h1><p class="intro">Accounts are stored locally. No email is needed for this local login. Sarvam generation uses the server’s API key.</p><div class="error" th:if="${error}" th:text="${error}"></div><form class="card" method="post" th:action="@{/register}"><label>Username<input name="username" required pattern="[A-Za-z0-9_]{3,50}" maxlength="50" autocomplete="username"><small>3–50 letters, digits or underscores.</small></label><label>Password<input name="password" type="password" minlength="10" maxlength="64" required autocomplete="new-password"><small>10–64 characters.</small></label><button>Create account →</button></form><a th:href="@{/login}">Back to sign in</a><footer th:replace="~{fragments :: footer}"></footer></main></body></html>
