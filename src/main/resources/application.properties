spring.application.name=Name Garden
server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:${APP_DATA:./data}/names;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.thymeleaf.cache=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never

sarvam.api-key=${SARVAM_API_KEY:}
sarvam.model=${SARVAM_MODEL:sarvam-105b}
sarvam.max-batches=${SARVAM_MAX_BATCHES:36}
sarvam.max-seconds=${SARVAM_MAX_SECONDS:28}
sarvam.parallelism=${SARVAM_PARALLELISM:14}
