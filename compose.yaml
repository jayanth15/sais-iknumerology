services:
  numerology:
    build: .
    image: iks-numerology:java17
    container_name: iks-numerology
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SARVAM_API_KEY: ${SARVAM_API_KEY:?Set SARVAM_API_KEY in your terminal before starting Docker Compose}
      BIND_ADDRESS: 0.0.0.0
      PORT: 8080
      APP_DATA: /app/data
    volumes:
      - iks_numerology_data:/app/data
    restart: unless-stopped

volumes:
  iks_numerology_data:
