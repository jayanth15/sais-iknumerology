services:
  numerology:
    build: .
    image: iks-numerology:java17
    container_name: iks-numerology
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_PARALLELISM: ${SARVAM_PARALLELISM:-14}
      SARVAM_MAX_BATCHES: ${SARVAM_MAX_BATCHES:-36}
      SARVAM_MAX_SECONDS: ${SARVAM_MAX_SECONDS:-28}
      BIND_ADDRESS: 0.0.0.0
      PORT: 8080
      APP_DATA: /app/data
    volumes:
      - iks_numerology_data:/app/data
    restart: unless-stopped

volumes:
  iks_numerology_data:
